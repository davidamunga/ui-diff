<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clock</title></head>
<body>
  <p id="now"></p>
  <p id="rand"></p>
  <script>
    document.getElementById('now').textContent = 'now ' + new Date().toISOString().slice(0, 16);
    document.getElementById('rand').textContent = 'rand ' + [Math.random(), Math.random()].map((n) => n.toFixed(6)).join(' ');
  </script>
</body>
</html>
